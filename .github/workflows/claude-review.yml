# Claude 자동 PR 리뷰
#
# 전제: 저장소(또는 조직) 시크릿에 ANTHROPIC_API_KEY 가 등록되어 있어야 한다.
# 시크릿이 없으면 이 워크플로는 조용히 건너뛴다(아래 if 조건) — PR 자체를 막지는 않는다.
#
# 왜 ubuntu-latest 인가: 이 클러스터의 self-hosted runner(k3s-home)는 배포 전용이며
# 배포용 kubeconfig 에 접근할 수 있다. API 키를 그 러너에 올리면 노출면이 넓어지므로
# 리뷰 잡은 GitHub 호스티드 러너에서 돌린다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for API key
        id: guard
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 Claude 리뷰를 건너뜁니다."
          fi
      - name: Claude review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            PR 변경분을 리뷰하라. 이 저장소는 상품/재고 API 이며 Redis 캐시를 쓴다.
            
            우선 확인할 것:
            1. 상품/재고/배너를 바꾸는 쓰기 경로에 대응하는 캐시 무효화(@CacheEvict)가 있는가. 캐시가 낡으면
               에러 없이 옛 가격·품절 상품을 그대로 응답한다. @Cacheable 키와 @CacheEvict 키가 실제로 일치하는가.
            2. 스키마 변경이 Flyway 로만 이뤄졌는가(ddl-auto=validate). 적용된 마이그레이션 수정 금지.
            3. 재고 차감 멱등성(V3__inventory_deduct_idempotency.sql)이 유지되는가. 멱등성 키가 바뀌면
               중복 차감 방지가 조용히 무력화된다. DB 레벨 제약(재고 음수 방지 CHECK 등)을 약화시키지 않는가.
            
            확실한 결함만 지적할 것.
          claude_args: --model claude-sonnet-5 --max-turns 15
