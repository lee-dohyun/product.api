spring:
  application:
    name: product.api

  datasource:
    url: jdbc:postgresql://${DB_HOST:catalog-postgres.customer.svc.cluster.local}:${DB_PORT:5432}/${DB_NAME:catalogdb}
    username: ${DB_USER:catalog_user}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:redis-service.customer.svc.cluster.local}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

admin:
  staff-realm-url: ${STAFF_REALM_URL:http://keycloak-service.keycloak.svc.cluster.local/realms/staff}

app:
  cors-allowed-origin-pattern: ${CORS_ALLOWED_ORIGIN_PATTERN:https://*.posselect.com}

# RAG 상품 Q&A(product.api#46). 키 미설정 시 부팅은 정상, 호출 시점에 503(RagUnavailableException).
openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  chat-model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
