spring:
  application:
    name: product.api

  datasource:
    url: jdbc:postgresql://${DB_HOST:catalog-postgres.customer.svc.cluster.local}:${DB_PORT:5432}/${DB_NAME:catalogdb}
    username: ${DB_USER:catalog_user}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:redis-service.customer.svc.cluster.local}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

admin:
  shared-secret: ${ADMIN_SHARED_SECRET:}
