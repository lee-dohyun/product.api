plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'com.dh'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
	// 이미지 스캔 경고 중 Boot 4.0.8 이 관리하는 버전보다 뒤에 수정본이 나온 것들(gateway#348).
	// Boot 를 올려 관리 버전이 이 값을 넘어서면 해당 줄을 지운다 - 남겨 두면 오히려 낮은 버전에 묶인다.
	set('tomcat.version', '11.0.27')
	set('jackson-bom.version', '3.1.7')
	set('jackson-2-bom.version', '2.21.7')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// RestClient.Builder 빈(RAG 임베딩·채팅 클라이언트가 주입받는다)도 Boot 4 에서는 별도 모듈이다.
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'com.nimbusds:nimbus-jose-jwt:9.37.4'
	// Boot 4 의 웹 계층은 Jackson 3(tools.jackson)을 쓰지만, Redis 캐시 직렬화(RedisConfig)와 장바구니·
	// 검수 코드는 Jackson 2(com.fasterxml) ObjectMapper 를 직접 만든다. 캐시에 이미 들어 있는 값의
	// 형식을 바꾸지 않으려고 그대로 두고, Boot 가 더는 끌어오지 않는 모듈을 명시한다(gateway#348).
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	// Boot 4 는 자동 설정을 모듈로 쪼갰다 - 이 스타터가 없으면 Flyway 가 클래스패스에 있어도 부팅 때
	// 마이그레이션이 돌지 않는다(gateway#348).
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	// 트랜잭션 전파/멱등성은 단위 테스트로 검증이 성립하지 않는다 - 실제 Postgres에 커밋된
	// 행을 봐야 한다 (posselect #211 롤백 사례, ~/msa/AGENTS.md §3).
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}
